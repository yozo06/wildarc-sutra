name: tts
# Records an app's sentences with Sarvam AI. Any repository can call this; see src/tts/README.md.
#   mode "sample": a few sentences per voice, attached to the run as "tts-voice-samples" with a page
#                  to listen. Nothing is committed.
#   mode "full":   everything still missing, in one voice or in several (each voice its own pack);
#                  commits the clips and the manifest, then starts the caller's publish workflow if
#                  one is named. What was recorded is committed even if some sentences failed, so a
#                  second run only pays for the rest.
# The caller passes its SARVAM_API_KEY secret and grants `contents: write` and `actions: write`.
on:
  workflow_call:
    inputs:
      mode:
        description: sample or full
        type: string
        default: sample
      sentences:
        description: 'A command, run in the caller repository, that prints the sentences as JSON: [{ "text", "lang" }]'
        type: string
        required: true
      speakers:
        description: 'sample: voices to try, comma-separated'
        type: string
        default: ritu,kavya,roopa,gokul
      speaker:
        description: 'full: the one voice to use (ignored when "voices" is given)'
        type: string
        default: ritu
      voices:
        description: 'full: several voices, comma-separated, each its own pack named after the voice. "gokul,roopa" or with labels "gokul=Gokul,roopa=Roopa"'
        type: string
        default: ''
      pace:
        description: Speaking pace, 0.5 to 2.0 (1.0 is normal)
        type: string
        default: '0.9'
      force:
        description: 'full: record again what already exists'
        type: boolean
        default: false
      audio-dir:
        description: Folder that holds the voice packs
        type: string
        default: app/audio
      pack:
        description: 'Folder name of the voice pack (one voice only; with "voices" each pack is named after its voice)'
        type: string
        default: sarvam
      label:
        description: 'Name of the pack as learners see it (one voice only)'
        type: string
        default: Sarvam
      default-pack:
        description: 'full: make this pack the default (empty = leave the default as it is)'
        type: string
        default: ''
      after:
        description: 'full: a command to run after recording, before the commit (rebuild a file list, run checks)'
        type: string
        default: ''
      commit:
        description: 'full: extra paths to commit besides the audio folder, space-separated'
        type: string
        default: ''
      publish:
        description: 'full: a workflow file in the caller repository to start after the push, e.g. pages.yml'
        type: string
        default: ''
      sutra-ref:
        description: Branch or tag of wildarc-sutra to record with
        type: string
        default: main
    secrets:
      SARVAM_API_KEY:
        required: true
jobs:
  tts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      # Inputs reach the shell only through the environment, never pasted into a script.
      MODE: ${{ inputs.mode }}
      SENTENCES: ${{ inputs.sentences }}
      SPEAKERS: ${{ inputs.speakers }}
      SPEAKER: ${{ inputs.speaker }}
      VOICES: ${{ inputs.voices }}
      PACE: ${{ inputs.pace }}
      FORCE: ${{ inputs.force }}
      AUDIO_DIR: ${{ inputs.audio-dir }}
      PACK: ${{ inputs.pack }}
      LABEL: ${{ inputs.label }}
      DEFAULT_PACK: ${{ inputs.default-pack }}
      AFTER: ${{ inputs.after }}
      COMMIT: ${{ inputs.commit }}
      PUBLISH: ${{ inputs.publish }}
      SUTRA_REF: ${{ inputs.sutra-ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the request
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          test -n "$SARVAM_API_KEY" || { echo "::error::Add the repository secret SARVAM_API_KEY first."; exit 1; }
          case "$MODE" in sample|full) ;; *) echo "::error::mode must be sample or full, got '$MODE'"; exit 1;; esac
      - name: Get the recorder
        run: |
          git clone --quiet --depth 1 --branch "$SUTRA_REF" https://github.com/yozo06/wildarc-sutra "$RUNNER_TEMP/sutra"
          cd "$RUNNER_TEMP/sutra" && npm install --no-audit --no-fund --silent
      - name: Collect the sentences
        run: |
          bash -c "$SENTENCES" > "$RUNNER_TEMP/sentences.json"
          node "$RUNNER_TEMP/sutra/bin/sutra-tts.mjs" --sentences "$RUNNER_TEMP/sentences.json" --out "$AUDIO_DIR" --pack "$PACK" --list
      - name: Sample voices
        if: inputs.mode == 'sample'
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node "$RUNNER_TEMP/sutra/bin/sutra-tts.mjs" --sentences "$RUNNER_TEMP/sentences.json" --sample --speakers "$SPEAKERS" --pace "$PACE" --samples "$RUNNER_TEMP/tts-samples"
      - name: Offer the samples as a download
        if: inputs.mode == 'sample'
        uses: actions/upload-artifact@v4
        with:
          name: tts-voice-samples
          path: ${{ runner.temp }}/tts-samples
          if-no-files-found: error
      - name: Record everything
        if: inputs.mode == 'full'
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          status=0
          record() {   # speaker, pack, label
            set -- --sentences "$RUNNER_TEMP/sentences.json" --out "$AUDIO_DIR" --speaker "$1" --pack "$2" --label "$3" --pace "$PACE" --prune
            if [ -n "$DEFAULT_PACK" ]; then set -- "$@" --default "$DEFAULT_PACK"; fi
            if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
            node "$RUNNER_TEMP/sutra/bin/sutra-tts.mjs" "$@" || status=1
          }
          if [ -n "$VOICES" ]; then
            IFS=',' read -ra LIST <<< "$VOICES"
            for v in "${LIST[@]}"; do
              v="$(echo "$v" | xargs)"; [ -n "$v" ] || continue
              speaker="${v%%=*}"; label="${v#*=}"
              if [ "$label" = "$v" ]; then label="$(echo "${speaker:0:1}" | tr '[:lower:]' '[:upper:]')${speaker:1}"; fi
              echo "::group::Voice $speaker"; record "$speaker" "$speaker" "$label"; echo "::endgroup::"
            done
            echo "TTS_WHAT=$(echo "$VOICES" | sed 's/=[^,]*//g; s/ *, */, /g')" >> "$GITHUB_ENV"
          else
            record "$SPEAKER" "$PACK" "$LABEL"
            echo "TTS_WHAT=$PACK pack, voice $SPEAKER" >> "$GITHUB_ENV"
          fi
          echo "TTS_STATUS=$status" >> "$GITHUB_ENV"
      - name: After recording
        if: inputs.mode == 'full' && inputs.after != ''
        # If this fails the clips are still committed (they cost money to make); the run ends red.
        run: |
          if ! bash -c "$AFTER"; then
            echo "::error::The command after recording failed."
            echo "TTS_AFTER=failed" >> "$GITHUB_ENV"
          fi
      - name: Commit and push
        if: inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$AUDIO_DIR" $COMMIT
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Voices: $TTS_WHAT; pace $PACE"
          git push
          echo "TTS_PUSHED=1" >> "$GITHUB_ENV"
      - name: Publish
        if: inputs.mode == 'full' && inputs.publish != '' && env.TTS_PUSHED == '1' && env.TTS_AFTER != 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "$PUBLISH" --ref "$GITHUB_REF_NAME"
      - name: Report
        if: inputs.mode == 'full'
        run: |
          if [ "$TTS_STATUS" != "0" ]; then echo "::error::Some sentences could not be recorded (see the Record step). What succeeded is saved; run again to record the rest."; exit 1; fi
          if [ "$TTS_AFTER" = "failed" ]; then echo "::error::Clips are saved, but the command after recording failed, so nothing was published. Fix it and publish by hand."; exit 1; fi
          echo "All sentences recorded."
